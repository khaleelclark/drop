name: Mac Delete WebView diagnostic

on:
  push:
    branches: [diagnostics/mac-delete-webview]
    paths:
      - '.github/workflows/macos-delete-diagnostic.yml'
      - '.github/mac-delete-baseline-sha256.json'
      - 'integrations/macos/test-delete-webview.*'
      - 'integrations/macos/delete-webview-fixture.js'
      - 'scripts/macos-delete-webkit.cjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Checkout exact reported 0.1.4 source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 92c60cd923da8e5952731740bcf15ee59de2c8b1
          path: baseline-src
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.16.0'

      - name: Prepare exact frontend baseline
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/zing-diagnostic-tools" --no-audit --no-fund pnpm@11.10.0
          export PATH="$RUNNER_TEMP/zing-diagnostic-tools/node_modules/.bin:$PATH"
          pnpm --dir baseline-src/web install --frozen-lockfile
          pnpm --dir baseline-src/web build
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const expected = JSON.parse(fs.readFileSync('.github/mac-delete-baseline-sha256.json', 'utf8'));
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile()) files.push(file);
              else throw Error('Non-regular baseline asset');
            }
          }
          walk('baseline-src/web/dist');
          if (files.length !== expected.length) throw Error('Baseline asset count changed');
          for (const asset of expected) {
            const file = path.join('baseline-src', asset.path);
            const bytes = fs.readFileSync(file);
            if (bytes.length !== asset.bytes || crypto.createHash('sha256').update(bytes).digest('hex') !== asset.sha256) {
              throw Error('Baseline bytes do not match reported 0.1.4: ' + asset.path);
            }
          }
          console.log('All nine baseline assets match the verified 0.1.4 installer receipts.');
          NODE

      - name: Install project-local WebKit test browser
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/zing-webkit
        run: |
          "$RUNNER_TEMP/zing-diagnostic-tools/node_modules/.bin/pnpm" --dir baseline-src/web exec playwright install webkit

      - name: Observe Mac WebKit baseline and explicit tabindex differential
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/zing-webkit
        run: |
          mkdir -p diagnostic-results
          set +e
          node scripts/macos-delete-webkit.cjs baseline-src/web/dist diagnostic-results/baseline baseline
          baseline_status=$?
          node scripts/macos-delete-webkit.cjs baseline-src/web/dist diagnostic-results/tabindex tabindex
          tabindex_status=$?
          set -e
          printf 'baseline=%s\ntabindex=%s\n' "$baseline_status" "$tabindex_status" > diagnostic-results/exit-status.txt
          test "$baseline_status" -eq 0
          test "$tabindex_status" -eq 0

      - name: Upload diagnostic traces and snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-delete-webview-diagnostic
          path: diagnostic-results/
          if-no-files-found: warn
          retention-days: 14
