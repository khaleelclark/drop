[package]
name = "household-native"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
directories = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "household-share-cli"
path = "src/main.rs"
